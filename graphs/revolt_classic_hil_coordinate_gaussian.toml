# REVOLT Classic HIL sensor boundary with coordinate-Gaussian PDM evaluation.
#
# The graph owns one explicitly timed five-layer atmosphere and advances it by
# 2 ms for every complete frame, matching the maintained 500 Hz camera setting.
# A serialized RTC adapter places one complete
# PDM command in the caller-owned command buffer before each graph step. This
# graph applies that command through an explicitly provisional
# continuous-facesheet model, composes the resulting surface OPD with the
# atmospheric OPD, forms the diffractive Shack-Hartmann photon-rate mosaic, and
# completes one noisy C-BLUE One IMX425 global-shutter CMOS frame suitable for
# publication through a transport adapter such as PipeWireAO.
#
# Optical values follow REVOLT/Python/specula/params_revolt_modal.yml. The
# detector identity, ROI, cadence, exposure, and gain follow the maintained
# HEART REVOLT configuration and its C-BLUE One IMX425 handler. The remaining
# detector values are published typical IMX425 characterization rather than
# unit calibration. The atmosphere profile follows the matching REVOLT OOPAO
# model and Julia common contract. The explicit RNG seed is an AOS
# reproducibility choice because those sources do not declare one.
# The exact 277-actuator command order comes from the matching 19-by-19 map
# payloads in the maintained on-sky and Copper branches. The caller binds the
# normalized-pupil coordinates produced by
# `REVOLTClassicSim.actuator_coordinates`.
# REVOLT simulation sources place 17 actuator centres across the pupil and the
# OOPAO ideal profile uses 0.35 adjacent mechanical coupling; an older OOMAO
# script uses 0.30. Selecting 0.35 gives the provisional normalized Gaussian
# width of 0.08626550214129701.
# AX307_Influences.fits belongs to the 468-actuator BAX307/SPIDERS mirror, not
# HSDM277. Replace this analytic node with deformable_mirror_surface_f32 when a
# qualified HSDM277 sampled influence calibration is available.
#
# The PDM input contains one unit-peak actuator surface-OPD coefficient in
# metres per command element. It is not an ALPAO normalized hardware command; a
# transport adapter must apply a separately qualified command calibration
# before this graph boundary.

schema_version = 1
name = "revolt_classic_hil_coordinate_gaussian"

[[nodes]]
name = "atmosphere"
type = "multilayer_atmosphere_opd_f32"

[nodes.config]
resolution = 240
telescope_diameter_m = 1.22
central_obstruction_ratio = 0.20491803278688525
pupil_reflectivity = 1.0
aperture_revision = 1
r0 = 0.15
reference_wavelength_m = 5.0e-7
L0 = 30.0
fractional_cn2 = [0.45, 0.10, 0.10, 0.25, 0.10]
wind_speed = [5.0, 5.0, 7.0, 10.0, 10.0]
wind_direction_deg = [0.0, 72.0, 144.0, 216.0, 288.0]
altitude = [0.0, 1000.0, 5000.0, 10000.0, 12000.0]
layer_ids = [
    "revolt_ground",
    "revolt_1km",
    "revolt_5km",
    "revolt_10km",
    "revolt_12km",
]
atmosphere_step = 0.002
rng_seed = 1
atmosphere_opd_schema = "org.revolt.classic.atmosphere-opd-m.f32/1"

[[nodes]]
name = "pdm"
type = "gaussian_deformable_mirror_surface_f32"

[nodes.config]
resolution = 240
telescope_diameter_m = 1.22
central_obstruction_ratio = 0.20491803278688525
pupil_reflectivity = 1.0
aperture_revision = 1
actuator_count = 277
influence_width = 0.08626550214129701
pdm_command_schema = "org.revolt.hsdm277.actuator-surface-opd-m.f32/1"
surface_opd_schema = "org.revolt.hsdm277.pdm-surface-opd-m.f32/1"
actuator_coordinates_schema = "org.revolt.hsdm277.normalized-pupil-actuator-coordinates.f32/1"

[[nodes]]
name = "pupil_opd_composition"
type = "pupil_opd_composition_f32"

[nodes.config]
resolution = 240
uncompensated_opd_schema = "org.revolt.classic.atmosphere-opd-m.f32/1"
surface_opd_schema = "org.revolt.hsdm277.pdm-surface-opd-m.f32/1"
pupil_opd_schema = "org.revolt.classic.pupil-opd-m.f32/1"

[[nodes]]
name = "shwfs"
type = "shack_hartmann_rate_f32"

[nodes.config]
resolution = 240
telescope_diameter_m = 1.22
central_obstruction_ratio = 0.20491803278688525
pupil_reflectivity = 1.0
aperture_revision = 1
n_lenslets = 16
n_pix_subap = 22
diffraction_padding = 2
pixel_scale_arcsec = 0.697
valid_subaperture_threshold = 0.1
threshold_convolution = 0.05
half_pixel_shift = false
shannon_sampling = true
source_band = "R"
source_magnitude = 2.0
source_wavelength_m = 8.0e-7
source_separation_arcsec = 0.0
source_position_angle_deg = 0.0
opd_schema = "org.revolt.classic.pupil-opd-m.f32/1"
photon_rate_schema = "org.revolt.classic.shwfs-photon-rate.f32/1"

[[nodes]]
name = "detector"
type = "cmos_detector_acquisition_f32"

[nodes.config]
rows = 352
columns = 352
binning = 1
pixel_scale_arcsec = 0.697
wavelength_m = 8.0e-7
exposure_duration_s = 0.001896
# Approximate QE at the modeled 800 nm channel from the manufacturer's typical
# 20 C IMX425 curve. Replace it with measured unit QE and optical throughput.
quantum_efficiency = 0.27
# The maintained camera configuration selects 24 dB analog gain. The graph
# detector accepts a linear voltage gain: 10^(24/20).
gain = 15.848931924611133
dark_current_e_per_pixel_s = 0.96
# The maintained HEART snapshot does not state its pixel format. Twelve-bit
# mode selects the published high-sensitivity characterization used below.
bits = 12
# Published image full well at zero analog gain; with the configured 24 dB
# gain this also supplies the ADC scale and gives an earlier output clip.
full_well_e = 94000.0
photon_noise = true
readout_noise = true
# Published RMS read noise for 12-bit high-sensitivity operation at 24 dB.
readout_noise_e = 2.33
column_readout_noise_e = 0.0
row_readout_noise_e = 0.0
rng_seed = 0
photon_rate_schema = "org.revolt.classic.shwfs-photon-rate.f32/1"
frame_schema = "org.revolt.classic.shwfs-frame.f32/1"

[[inputs]]
name = "pdm_command"
destination = "pdm.pdm_command"
binding = "pdm_command"

[[outputs]]
name = "pdm_surface_opd"
source = "pdm.surface_opd"

[[outputs]]
name = "atmosphere_opd"
source = "atmosphere.atmosphere_opd"

[[outputs]]
name = "pupil_opd"
source = "pupil_opd_composition.pupil_opd"

[[outputs]]
name = "shwfs_photon_rate"
source = "shwfs.photon_rate"

[[outputs]]
name = "shwfs_frame"
source = "detector.frame"

[[links]]
source = "pdm.surface_opd"
destination = "pupil_opd_composition.surface_opd"

[[links]]
source = "atmosphere.atmosphere_opd"
destination = "pupil_opd_composition.uncompensated_opd"

[[links]]
source = "pupil_opd_composition.pupil_opd"
destination = "shwfs.opd"

[[links]]
source = "shwfs.photon_rate"
destination = "detector.photon_rate"

[[parameters]]
destination = "pdm.actuator_coordinates"
binding = "pdm_actuator_coordinates"
